        /* --- Options Panel Content --- */

        .option-group {

            text-align: left;

            white-space: normal;
            word-break: break-word;

        .quiz-option .option-prefix {

            width: 2.5em;
            margin-right: 0.5em;
            font-weight: 600;
            color: #6b7280;
            text-align: right;

        .quiz-option .option-text {
            flex-grow: 1;
            pointer-events: auto;
        }
        .quiz-option label .vocab-word {
            pointer-events: auto;
        }
        .quiz-option label:hover { background-color: #f9fafb; border-color: #9ca3af; }
        .quiz-option input[type="radio"]:checked + label {
            background-color: #dbeafe; border-color: #60a5fa; color: #1e40af; font-weight: 500;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }
        .quiz-option input[type="radio"]:checked + label .option-prefix {
            color: #1e40af;
        }
        .quiz-option input[type="radio"]:focus + label { box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.5); outline: none; }

        /* Feedback Styles for Option Labels */
        .quiz-option label.correct {
            background-color: #d1fae5 !important; border-color: #34d399 !important;
            color: #065f46 !important; font-weight: bold;
        }
         .quiz-option label.correct .option-prefix {
             color: #065f46 !important;
        }
        .quiz-option label.correct::after { content: ' ✔'; color: #059669; font-weight: bold; margin-left: auto; padding-left: 0.5em; }

        .quiz-option label.incorrect {
            background-color: #fee2e2 !important; border-color: #f87171 !important;
            color: #991b1b !important;
        }
         .quiz-option label.incorrect .option-prefix {
             color: #991b1b !important;

         .quiz-option label.incorrect::after { content: ' ✘'; color: #dc2626; font-weight: bold; margin-left: auto; padding-left: 0.5em; }

        .quiz-option label.missed-correct {
             border-color: #34d399;
        }
        .quiz-mode .quiz-option input[type="radio"]:disabled + label { cursor: default; }

        .sentence-analysis {

            margin-bottom: 0.5rem;

            margin-bottom: 0.25rem;

             border-radius: 3px;
             font-family: monospace;
        }

        /* Annotated sentence container (for grammar) */
        .sentence-annotated {
            padding: 0.5rem;
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 4px;
            line-height: 2.5;
            color: #374151;
            display: block; /* Keep as block */
            margin-top: 0.5rem;
            margin-bottom: 2.5em;
            display: none; /* Hide by default */
        }

        /* Style for correct answers inserted into annotated sentences */
        .sentence-annotated .correct-answer-text {
            font-weight: 600;
            color: #059669;
            border-bottom: 1px solid #059669;
            padding-bottom: 1px;
        }

        /* Grammar Annotation Styles */
        .grammar-phrase {
            position: relative;
            padding-bottom: 2px;
            margin-bottom: -2px;
            border-bottom-width: 1.5px;
            border-bottom-style: solid;
        }
        .grammar-phrase::after {
            content: attr(data-role);
            position: absolute;
            bottom: -2.5em;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7em;
            font-weight: 600;
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            color: #4b5563;
            white-space: nowrap;
            z-index: 1;
            opacity: 0.9;
        }
        /* Specific colors for roles (applied to text color) */
        .grammar-subject { border-bottom-color: #3b82f6; }
        .grammar-verb { border-bottom-color: #ef4444; }
        .grammar-object { border-bottom-color: #10b981; }
        .grammar-predicate { border-bottom-color: #f97316; }
        .grammar-adverbial { border-bottom-color: #8b5cf6; }
        .grammar-adjectival { border-bottom-color: #ec4899; }
        .grammar-clause { border-bottom-color: #6b7280; border-bottom-style: dashed; }
        .grammar-conjunction { border-bottom-color: #a16207; border-bottom-style: dotted; }
        .grammar-prepositional-phrase { border-bottom-color: #0891b2; }

        /* Adjust label text colors */
        .grammar-subject::after { color: #3b82f6; }
        .grammar-verb::after { color: #ef4444; }
        .grammar-object::after { color: #10b981; }
        .grammar-predicate::after { color: #f97316; }
        .grammar-adverbial::after { color: #8b5cf6; }
        .grammar-adjectival::after { color: #ec4899; }
        .grammar-clause::after { color: #6b7280; }
        .grammar-conjunction::after { color: #a16207; }
        .grammar-prepositional-phrase::after { color: #0891b2; }

        /* Ensure vocab words within grammar phrases are still interactive */
        .grammar-phrase .vocab-word {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
         .grammar-phrase .vocab-word::after {
             display: none;
         }

        /* Visibility Rules */
        /* Show analysis/annotations ONLY in study mode AND when analysis is visible */
        .study-mode.analysis-visible .sentence-analysis,
        .study-mode.analysis-visible .sentence-annotated {
            display: block;
        }
        /* Hide analysis/annotations/translation in quiz mode OR when analysis not visible */
        /* MODIFIED: Added !important to ensure hiding */
        .quiz-mode .sentence-analysis,
        .quiz-mode .sentence-annotated,
        body:not(.analysis-visible) .sentence-analysis,
        body:not(.analysis-visible) .sentence-annotated {
            display: none !important;
        }
        /* Ensure translation text is also hidden if not explicitly shown */
         .sentence-translation:not(.visible) { /* Assuming JS adds/removes 'visible' class */
             display: none;
         }


    </style>

        // --- Functions (Defined globally) ---

        // Map grammar roles to Chinese labels (Used in CSS ::after pseudo-element)
        // function getChineseRoleName(role) { ... } // No longer needed directly in JS

        // Parses text containing {{VOCAB:...}} markers into spans with tooltips
        function parseTextWithVocab(text) {
            if (typeof text !== 'string') return '';
            // Added check to avoid parsing inside existing grammar spans
            return text.replace(/{{VOCAB:(.*?):(.*?)}}(?![^<]*>)/g, function(match, word, translation) {
                const encodedTranslation = encodeURIComponent(translation);
                return `<span class="vocab-word" data-translation="${encodedTranslation}" style="pointer-events: auto;">${word}<span class="tooltip">${translation}</span></span>`;
            });
        }

         // Generates the blank placeholder span
         function generateBlankPlaceholder(id) {
             const initialText = `___(${id})___`;
             return `<span class="blank-placeholder" data-blank-id="${id}" onclick="activateBlank(${id})">${initialText}</span>`;
         }

         // Gets the correct answer text (raw, without vocab markers)
         function getCorrectAnswerRawText(blankId) {
             const blankData = clozeData.find(b => b.id === parseInt(blankId));
             if (blankData && blankData.correctIndex !== null && blankData.options[blankData.correctIndex]) {
                 let correctText = blankData.options[blankData.correctIndex];
                 correctText = correctText.replace(/^\[[A-Z]\]\s*/, ''); // Remove [A], [B]... prefix
                 correctText = correctText.replace(/{{VOCAB:(.*?):.*?}}/g, '$1'); // Remove vocab markup
                 return correctText;
             }
             console.warn(`Correct raw answer text not found for blank ID: ${blankId}`);
             return `___(${blankId})___`; // Fallback
         }

         // Gets the correct answer text WITH vocab markers parsed
          function getCorrectAnswerParsedText(blankId) {
              const blankData = clozeData.find(b => b.id === parseInt(blankId));
              if (blankData && blankData.correctIndex !== null && blankData.options[blankData.correctIndex]) {
                  let correctText = blankData.options[blankData.correctIndex];
                  correctText = correctText.replace(/^\[[A-Z]\]\s*/, ''); // Remove [A], [B]... prefix
                  return parseTextWithVocab(correctText); // Parse vocab
              }
              console.warn(`Correct parsed answer text not found for blank ID: ${blankId}`);
              return `___(${blankId})___`; // Fallback
          }


         // Cleans analysis text for display in the analysis block
         function cleanAnalysisText(text) {
             if (typeof text !== 'string') return '';
             // First, replace vocab markers with <code>word</code>
             let cleaned = text.replace(/{{VOCAB:(.*?):.*?}}/g, '<code>$1</code>');
             // Then, replace blank markers with the correct raw answer text wrapped in <code>
             cleaned = cleaned.replace(/{{BLANK:(\d+)}}/g, (match, id) => {
                 const answerText = getCorrectAnswerRawText(id);
                 return `<code>${answerText}</code>`;
             });
             return cleaned;
         }

        // Generates the HTML for the annotated sentence with grammar markup
        function generateAnnotatedSentenceHTML(rawSentence, grammarMarkupData) {
            if (!grammarMarkupData) {
                // Fallback: Just show sentence with correct answers if no grammar markup provided
                let sentenceWithAnswers = rawSentence.replace(/{{BLANK:(\d+)}}/g, (match, id) => {
                    const parsedCorrectText = getCorrectAnswerParsedText(id);
                    return `<span class="correct-answer-text">${parsedCorrectText}</span>`;
                });
                return parseTextWithVocab(sentenceWithAnswers); // Parse any remaining vocab
            }

            // 1. Fill blanks within the grammar markup with parsed correct answers
            let processedGrammarMarkup = grammarMarkupData.replace(/{{BLANK:(\d+)}}/g, (match, id) => {
                const parsedCorrectText = getCorrectAnswerParsedText(id);
                // Wrap the parsed answer in the specific class for styling
                return `<span class="correct-answer-text">${parsedCorrectText}</span>`;
            });

            // 2. Parse any remaining vocab markers within the grammar markup
            // Note: parseTextWithVocab is designed to handle nested spans correctly
            processedGrammarMarkup = parseTextWithVocab(processedGrammarMarkup);

            return processedGrammarMarkup;
        }


        // Generates the detailed analysis block HTML
        function generateAnalysisBlockHTML(analysisText) {
            if (!analysisText) return '';
            const cleanedText = cleanAnalysisText(analysisText);
            return `<div class="sentence-analysis">${cleanedText}</div>`;
        }


        // Builds the HTML for the passage
        function buildPassageHTML() {
            if (!passageContainer) {
                console.error("Passage container not found during buildPassageHTML");
                return;
            }
            let processedHTML = '';
            const paragraphs = passageRaw.trim().split('</p>');

            paragraphs.forEach(p => {
                if (!p.trim()) return;

                let paragraphContent = p.replace('<p>', '').trim();
                let paragraphHTML = '';

                try {
                    // Process sentence markers within the paragraph content
                    paragraphHTML = paragraphContent.replace(/{{SENTENCE:(.*?)}}\|\|\|{(.*?)}/gs, (match, sentence, translation) => {
                        const rawSentence = sentence;
                        const sentenceData = analysisData[rawSentence] || {};
                        const analysisText = sentenceData.analysisText || '';
                        const grammarMarkup = sentenceData.grammarMarkup || null; // Get grammar markup

                        // Generate original sentence HTML (with placeholders)
                        let originalSentenceHTML = parseTextWithVocab(rawSentence);
                        originalSentenceHTML = originalSentenceHTML.replace(/{{BLANK:(\d+)}}/g, (blankMatch, id) => generateBlankPlaceholder(id));

                        // Generate annotated sentence HTML (using grammar markup if available)
                        const annotatedSentenceHTML = generateAnnotatedSentenceHTML(rawSentence, grammarMarkup);

                        // Generate analysis block HTML (cleaned text)
                        const analysisBlockHTML = generateAnalysisBlockHTML(analysisText);

                        // Assemble the container for this sentence
                        // Added sentence-wrapper span for better inline flow control
                        return `<span class="sentence-container">` +
                                   `<span class="sentence-wrapper"><span class="sentence">${originalSentenceHTML}</span>` + // Original sentence
                                   `<button class="toggle-translation-btn" onclick="toggleSingleTranslation(this)">译</button></span>` + // Translation button next to sentence
                                   `<span class="sentence-translation">${translation}</span>` + // Translation block
                                   `<div class="sentence-annotated">${annotatedSentenceHTML}</div>` + // Annotated version (grammar/answers)
                                   analysisBlockHTML + // Detailed analysis block
                               `</span>`;
                    });
                    processedHTML += `<p>${paragraphHTML}</p>`; // Re-wrap in paragraph tag
                } catch (error) {
                     console.error("Error processing paragraph content:", error);
                     processedHTML += `<p style="color: red;">Error displaying content.</p>`; // Add error message to UI
                }
            });


            passageContainer.innerHTML = processedHTML;
            setupVocabTooltips(); // Setup tooltips for both original and annotated sentences
            updateAllPlaceholdersFromState();
        }

        // --- Rest of the functions ---
        // Builds the entire options panel
        function buildAllOptionsPanel() {
             if (!optionsPanelContent || !bodyElement) return;

            let allOptionsHTML = '';
            clozeData.forEach(blankData => {
                allOptionsHTML += `<div class="option-group" id="option-group-${blankData.id}">`;
                allOptionsHTML += `<span class="question-number">${blankData.id}.</span>`;
                allOptionsHTML += `<div class="quiz-options">`;
                blankData.options.forEach((option, index) => {
                    const inputId = `q${blankData.id}_opt${index}`;
                    const isSelected = blankData.selectedIndex === index;
                    const match = option.match(/^(\[[A-Z]\])\s*(.*)$/);
                    let prefix = `[${String.fromCharCode(65 + index)}]`;
                    let textContent = option;
                    if (match) {
                        prefix = match[1];
                        textContent = match[2];
                    }
                    const parsedTextContent = parseTextWithVocab(textContent);
                    allOptionsHTML += `<div class="quiz-option">`;
                    allOptionsHTML += `<input type="radio" id="${inputId}" name="question_${blankData.id}" value="${index}" ${isSelected ? 'checked' : ''} onchange="handleOptionSelect(${blankData.id}, ${index})">`;
                    allOptionsHTML += `<label for="${inputId}">`;
                    allOptionsHTML += `<span class="option-prefix">${prefix}</span>`;
                    allOptionsHTML += `<span class="option-text">${parsedTextContent}</span>`;
                    allOptionsHTML += `</label>`;
                    allOptionsHTML += `</div>`;
                });
                allOptionsHTML += `</div>`;
                allOptionsHTML += `</div>`;
            });
            optionsPanelContent.innerHTML = allOptionsHTML;
            setupVocabTooltips();
            if (bodyElement.classList.contains('study-mode')) {
                 clozeData.forEach(blank => {
                     if(blank.selectedIndex !== null) applyStudyModeFeedback(blank.id, blank.selectedIndex);
                 });
            } else if (isCheckingAnswers) {
                 clozeData.forEach(blank => applyQuizModeFeedback(blank.id));
            }
        }

        // Highlights the clicked blank
        function activateBlank(blankId) {
            if (!passageContainer) return;

            if (currentActiveBlankId !== null) {
                const previousPlaceholders = passageContainer.querySelectorAll(`.blank-placeholder[data-blank-id="${currentActiveBlankId}"]`);
                previousPlaceholders.forEach(p => p.classList.remove('active'));
            }
            currentActiveBlankId = blankId;
            // Activate placeholder in the original sentence only
            const currentPlaceholder = passageContainer.querySelector(`.sentence > .blank-placeholder[data-blank-id="${blankId}"], .sentence span > .blank-placeholder[data-blank-id="${blankId}"]`);
            currentPlaceholder?.classList.add('active');

            const optionGroup = document.getElementById(`option-group-${blankId}`);
            if (optionGroup) {
                optionGroup.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                 optionGroup.style.backgroundColor = '#eff6ff';
                 setTimeout(() => { optionGroup.style.backgroundColor = ''; }, 1500);
            }
        }

        // Handles selecting an option
        function handleOptionSelect(blankId, selectedIndex) {
            const blankData = clozeData.find(b => b.id === blankId);
            if (!blankData || !bodyElement || !scoreDisplay) return;

            blankData.selectedIndex = selectedIndex;

            updatePlaceholderText(blankId); // Update original sentence placeholder
            if (bodyElement.classList.contains('study-mode')) {
                applyStudyModeFeedback(blankId, selectedIndex);
            } else if (isCheckingAnswers) {
                applyQuizModeFeedback(blankId);
                const correctCount = clozeData.filter(b => b.selectedIndex === b.correctIndex).length;
                scoreDisplay.textContent = `得分: ${correctCount} / ${clozeData.length}`;
            }
        }

        // Updates the placeholder in the original sentence
        function updatePlaceholderText(blankId) {
             if (!passageContainer) return;
             // Target only placeholders within the .sentence span
             const placeholder = passageContainer.querySelector(`.sentence .blank-placeholder[data-blank-id="${blankId}"]`);
             const blankData = clozeData.find(b => b.id === blankId);
             if (placeholder && blankData) {
                 placeholder.classList.remove('correct', 'incorrect', 'answered');
                 if (blankData.selectedIndex !== null && blankData.selectedIndex >= 0 && blankData.selectedIndex < blankData.options.length) {
                     const selectedText = blankData.options[blankData.selectedIndex].replace(/^\[[A-Z]\]\s*/, '');
                     const cleanSelectedText = selectedText.replace(/{{VOCAB:(.*?):.*?}}/g, '$1'); // Use raw text
                     placeholder.textContent = cleanSelectedText;
                     placeholder.classList.add('answered');
                     if ((isCheckingAnswers && bodyElement.classList.contains('quiz-mode')) || bodyElement.classList.contains('study-mode')) {
                          if (blankData.selectedIndex === blankData.correctIndex) {
                             placeholder.classList.add('correct');
                         } else {
                             placeholder.classList.add('incorrect');
                         }
                     }
                 } else {
                     placeholder.textContent = `___(${blankId})___`;
                 }
             } else if(placeholder) {
                 placeholder.textContent = `___(${blankId})___`;
                 placeholder.classList.remove('correct', 'incorrect', 'answered');
             }
        }

        // Updates all original placeholders
        function updateAllPlaceholdersFromState() {
            clozeData.forEach(blank => {
                updatePlaceholderText(blank.id);
            });
        }

        // Sets up vocab tooltips for all vocab words (original, options, annotated)
        function setupVocabTooltips() {
            const allVocab = document.querySelectorAll('.vocab-word'); // Select all vocab words globally

            allVocab.forEach(word => {
                let tooltip = word.querySelector('.tooltip');
                const translation = word.dataset.translation ? decodeURIComponent(word.dataset.translation) : 'No translation';
                if (!tooltip) {
                    tooltip = document.createElement('span');
                    tooltip.classList.add('tooltip');
                    word.appendChild(tooltip); // Append tooltip directly to vocab word
                }
                tooltip.textContent = translation;

                // Ensure event listener is added only once
                word.removeEventListener('click', handleVocabClick);
                word.addEventListener('click', handleVocabClick);
            });

             // Use capture phase for document click to hide tooltips before vocab click triggers
             document.removeEventListener('click', hideAllTooltips, true);
             document.addEventListener('click', hideAllTooltips, true);
        }

        // Handles vocab clicks - prevent propagation to document listener
        function handleVocabClick(event) {
             if (!bodyElement || !bodyElement.classList.contains('study-mode')) return;
             event.stopPropagation(); // Stop click from reaching document

             const currentWord = event.currentTarget;
             const isActive = currentWord.classList.contains('active');

             // Deactivate other active tooltips first
             document.querySelectorAll('.vocab-word.active').forEach(w => {
                 if (w !== currentWord) { // Don't deactivate self yet
                     w.classList.remove('active');
                 }
             });

             // Toggle active state for the clicked word
             if (!isActive) {
                 currentWord.classList.add('active');
             } else {
                 currentWord.classList.remove('active'); // Allow clicking again to hide
             }
        }

        // Hides tooltips if click is outside a vocab word
        function hideAllTooltips(event) {
             // Check if the click target is inside a vocab word or its tooltip
             if (event.target.closest('.vocab-word')) return;

             // If click is outside, hide all active tooltips
             document.querySelectorAll('.vocab-word.active').forEach(word => {
                 word.classList.remove('active');
             });
        }


        // Toggles single translation
        function toggleSingleTranslation(button) {
            const container = button.closest('.sentence-container');
            if (!container) return;
            const translationSpan = container.querySelector('.sentence-translation');
            if (translationSpan) {
                const isVisible = translationSpan.style.display === 'block';
                translationSpan.style.display = isVisible ? 'none' : 'block';
                // Add/remove 'visible' class for potentially more robust CSS targeting
                translationSpan.classList.toggle('visible', !isVisible);
                button.textContent = isVisible ? '译' : '隐'; // Swap text
            }
        }

        // Shows/hides all sentence translations ONLY
        function showAllTranslations(show) {
            if (!passageContainer || !bodyElement) return;
            const translations = passageContainer.querySelectorAll('.sentence-translation');
            const buttons = passageContainer.querySelectorAll('.toggle-translation-btn');

            const displayValue = show ? 'block' : 'none';
            const buttonText = show ? '隐' : '译'; // Set correct text based on action

            translations.forEach(span => {
                span.style.display = displayValue;
                // Add/remove 'visible' class
                span.classList.toggle('visible', show);
            });
            buttons.forEach(btn => btn.textContent = buttonText);
        }

         // Shows/hides all sentence analysis/annotations ONLY
         function showAllAnalysis(show) {
             if (!bodyElement) return;
             if (show) {
                 bodyElement.classList.add('analysis-visible');
             } else {
                 bodyElement.classList.remove('analysis-visible');
             }
             // CSS rules handle the actual display based on .analysis-visible and .study-mode
         }


         // Clears feedback
         function clearAllAnswerFeedback() {
            isCheckingAnswers = false;
            if (scoreDisplay) scoreDisplay.textContent = '';
            if (!passageContainer || !optionsPanelContent) return;

            // Clear feedback from original sentence placeholders
            passageContainer.querySelectorAll('.sentence .blank-placeholder').forEach(p => {
                p.classList.remove('correct', 'incorrect', 'active');
                 const blankId = p.dataset.blankId;
                 if (!blankId) return;
                 const blankData = clozeData.find(b => b.id === parseInt(blankId));
                 if (blankData?.selectedIndex === null) { // Only reset text if no answer selected
                     p.textContent = `___(${blankId})___`;
                     p.classList.remove('answered');
                 } else {
                     // Keep the selected answer text, just remove feedback colors
                     updatePlaceholderText(blankId); // Re-render text without feedback classes
                 }
            });

            currentActiveBlankId = null;
            optionsPanelContent.querySelectorAll('.quiz-option label').forEach(label => {
                label.classList.remove('correct', 'incorrect', 'missed-correct');
            });
            optionsPanelContent.querySelectorAll('.quiz-option input[type="radio"]').forEach(radio => {
                 radio.disabled = false;
            });
        }

        // Switches to Study Mode
        function switchToStudyMode() {
            if (!bodyElement || !studyModeBtn || !quizModeBtn || !studyControlsDiv || !checkAnswersBtn || !scoreDisplay) return;

            clearAllAnswerFeedback(); // Clear feedback but keep selected answers
            bodyElement.classList.remove('quiz-mode');
            bodyElement.classList.add('study-mode');
            // showAllAnalysis(false); // Keep current analysis visibility state

            studyModeBtn.classList.add('active');
            quizModeBtn.classList.remove('active');
            studyControlsDiv.style.display = 'flex'; // Show study controls container
            checkAnswersBtn.style.display = 'none';
            scoreDisplay.style.display = 'none';
            // buildPassageHTML(); // No need to rebuild fully, CSS handles visibility
            buildAllOptionsPanel(); // Rebuild options to apply study mode feedback if needed
            updateAllPlaceholdersFromState(); // Ensure placeholders reflect current selections
            setupVocabTooltips(); // Re-attach tooltips if needed after panel rebuild
        }

        // Switches to Quiz Mode
        function switchToQuizMode() {
            if (!bodyElement || !studyModeBtn || !quizModeBtn || !studyControlsDiv || !checkAnswersBtn || !scoreDisplay) return;

            clearAllAnswerFeedback(); // Clear feedback but keep selected answers
            bodyElement.classList.remove('study-mode', 'analysis-visible'); // Remove study mode and force hide analysis
            bodyElement.classList.add('quiz-mode');

            quizModeBtn.classList.add('active');
            studyModeBtn.classList.remove('active');
            studyControlsDiv.style.display = 'none'; // Hide study controls container
            checkAnswersBtn.style.display = 'inline-block';
            checkAnswersBtn.disabled = false;
            scoreDisplay.style.display = 'block';
            scoreDisplay.textContent = ''; // Clear score display
            // buildPassageHTML(); // No need to rebuild fully, CSS handles visibility
            buildAllOptionsPanel(); // Rebuild options to remove study feedback styles
            hideAllTooltips({ target: null }); // Hide any open tooltips
            updateAllPlaceholdersFromState(); // Ensure placeholders reflect current selections
            setupVocabTooltips(); // Re-attach tooltips if needed after panel rebuild
        }

        // Applies study mode feedback (instant feedback on selection)
        function applyStudyModeFeedback(blankId, selectedIndex) {
            const blankData = clozeData.find(b => b.id === blankId);
            if (!blankData || !optionsPanelContent) return;

            const optionsGroup = optionsPanelContent.querySelector(`#option-group-${blankId}`);
            if (!optionsGroup) return;
            const labels = optionsGroup.querySelectorAll('.quiz-option label');
            const radios = optionsGroup.querySelectorAll('.quiz-option input[type="radio"]');
            labels.forEach(l => l.classList.remove('correct', 'incorrect', 'missed-correct'));
            // radios.forEach(r => r.disabled = false); // Keep options enabled in study mode

            const isCorrectSelection = selectedIndex === blankData.correctIndex;
            const selectedLabel = optionsGroup.querySelector(`label[for="q${blankId}_opt${selectedIndex}"]`);
            const correctLabel = optionsGroup.querySelector(`label[for="q${blankId}_opt${blankData.correctIndex}"]`);

            if (selectedLabel) {
                 if (isCorrectSelection) {
                    selectedLabel.classList.add('correct');
                } else {
                    selectedLabel.classList.add('incorrect');
                    // Optionally highlight the correct one if wrong one selected
                    // correctLabel?.classList.add('missed-correct');
                }
            }
            // updatePlaceholderText needs to reflect study mode feedback immediately
            updatePlaceholderText(blankId);
        }

        // Applies quiz mode feedback (only after clicking 'Check Answers')
        function applyQuizModeFeedback(blankId) {
            const blankData = clozeData.find(b => b.id === blankId);
            if (!blankData || !optionsPanelContent) return;

            const optionsGroup = optionsPanelContent.querySelector(`#option-group-${blankId}`);
            if (!optionsGroup) return;
            const radios = optionsGroup.querySelectorAll(`input[name="question_${blankId}"]`);
            radios.forEach(radio => {
                radio.disabled = true; // Disable options after checking
                const label = optionsGroup.querySelector(`label[for="${radio.id}"]`);
                if (!label) return;

                label.classList.remove('correct', 'incorrect', 'missed-correct');
                const optionIndex = parseInt(radio.value);
                const isCorrectAnswer = optionIndex === blankData.correctIndex;
                const isSelected = blankData.selectedIndex === optionIndex;

                if (isSelected) {
                    if (isCorrectAnswer) {
                        label.classList.add('correct');
                    } else {
                        label.classList.add('incorrect');
                    }
                }
                // Always show the correct answer, even if not selected
                 if (isCorrectAnswer) {
                     // If it was selected, it already has 'correct' class
                     // If it wasn't selected, add 'missed-correct' to highlight it
                     if (!isSelected) {
                         label.classList.add('missed-correct');
                     }
                 }
            });
             // Update placeholder text to show correct/incorrect status
             updatePlaceholderText(blankId);
        }

        // Checks answers in quiz mode
        function checkAnswers() {
            if (!bodyElement || !bodyElement.classList.contains('quiz-mode') || !checkAnswersBtn || !scoreDisplay) return;

            isCheckingAnswers = true;
            checkAnswersBtn.disabled = true; // Disable button after checking

            let correctCount = 0;
            clozeData.forEach(blank => {
                if (blank.selectedIndex === blank.correctIndex) {
                    correctCount++;
                }
                applyQuizModeFeedback(blank.id); // Apply feedback to options and placeholders
            });
            scoreDisplay.textContent = `得分: ${correctCount} / ${clozeData.length}`;
        }

        // --- Resizing Logic ---
        function initializeResizer() {
            if (!resizer || !passageContainer || !optionsPanelContent || !mainContent) return;

            let isResizing = false;
            let startX;

            resizer.addEventListener('mousedown', (e) => {
                if (window.getComputedStyle(mainContent).flexDirection !== 'row') {
                    return;
                }
                isResizing = true;
                startX = e.clientX;
                document.body.classList.add('resizing');

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            });

            function handleMouseMove(e) {
                if (!isResizing) return;

                const mainRect = mainContent.getBoundingClientRect();
                let newLeft = e.clientX - mainRect.left;

                const minWidthPx = 200;
                const resizerWidth = resizer.offsetWidth;
                const maxLeft = mainRect.width - minWidthPx - resizerWidth;

                if (newLeft < minWidthPx) {
                    newLeft = minWidthPx;
                }
                if (newLeft > maxLeft) {
                    newLeft = maxLeft;
                }

                // Directly set width in pixels
                passageContainer.style.width = `${newLeft}px`;
                // Right panel fills remaining space due to flex-grow: 1 in CSS
                resizer.style.left = `${newLeft}px`; // Update resizer position in pixels
            }

            function handleMouseUp() {
                if (isResizing) {
                    isResizing = false;
                    document.body.classList.remove('resizing');
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                }
            }
        }


        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Get elements
            passageContainer = document.getElementById('passage-content');
            optionsPanelContent = document.getElementById('options-panel-content');
            bodyElement = document.body;
            studyModeBtn = document.getElementById('study-mode-btn');
            quizModeBtn = document.getElementById('quiz-mode-btn');
            studyControlsDiv = document.querySelector('.study-controls');
            checkAnswersBtn = document.getElementById('check-answers-btn');
            scoreDisplay = document.getElementById('score-display');
            resizer = document.getElementById('resizer');
            mainContent = document.querySelector('.main-content');

            // Basic check for essential elements
            if (!passageContainer || !optionsPanelContent || !bodyElement || !studyModeBtn || !quizModeBtn || !studyControlsDiv || !checkAnswersBtn || !scoreDisplay || !resizer || !mainContent) {
                console.error("Initialization failed: Essential elements missing.");
                 if (passageContainer) {
                     passageContainer.innerHTML = "<p class='text-red-500 p-4'>加载内容时出错，请尝试刷新页面。</p>";
                 }
                return;
            }

            // Build initial HTML
            buildPassageHTML();
            buildAllOptionsPanel();

            // Set initial UI state
            if (bodyElement.classList.contains('study-mode')) {
                studyModeBtn.classList.add('active');
                quizModeBtn.classList.remove('active');
                studyControlsDiv.style.display = 'flex';
                checkAnswersBtn.style.display = 'none';
                scoreDisplay.style.display = 'none';
                showAllAnalysis(false); // Hide analysis by default
                showAllTranslations(false); // Hide translations by default
            } else {
                quizModeBtn.classList.add('active');
                studyModeBtn.classList.remove('active');
                studyControlsDiv.style.display = 'none';
                checkAnswersBtn.style.display = 'inline-block';
                checkAnswersBtn.disabled = false;
                scoreDisplay.style.display = 'block';
                 bodyElement.classList.remove('analysis-visible'); // Ensure analysis hidden in quiz mode
            }

            // Initialize the resizer functionality
            initializeResizer();
        });

    </script>

</body>
</html>
